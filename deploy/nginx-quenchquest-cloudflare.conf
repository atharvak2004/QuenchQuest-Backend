# QuenchQuest on its domains, behind Cloudflare (proxied, orange cloud).
#
#   https://www.quenchquestsocialfoundation.org   website (bare domain redirects here)
#   https://api.quenchquestsocialfoundation.org   API, /static/, /media/
#   http://127.0.0.1:8081                         API for the website's own server-side
#                                                 requests and health checks (local only)
#
# HTTPS is provided by Cloudflare (SSL/TLS mode "Flexible"): visitors connect to
# Cloudflare over https, and Cloudflare connects to this server over plain http on
# port 80, so no certificate is needed here. Don't add an http->https redirect on this
# server: under "Flexible" it would loop. Use Cloudflare's "Always Use HTTPS" instead.
#
# Can be enabled ALONGSIDE nginx-quenchquest-ip.conf (different upstream names).
# Use this OR nginx-quenchquest-domain.conf (certbot), never both. See DEPLOYMENT.md step 12.
# Install:
#   sudo cp deploy/nginx-quenchquest-cloudflare.conf /etc/nginx/sites-available/quenchquest
#   sudo ln -s /etc/nginx/sites-available/quenchquest /etc/nginx/sites-enabled/quenchquest
#   sudo nginx -t && sudo systemctl reload nginx

upstream qq_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream qq_api {
    server unix:/run/quenchquest-api/gunicorn.sock;
}

# ---------------------------------------------------------------- bare domain → www
server {
    listen 80;
    listen [::]:80;
    server_name quenchquestsocialfoundation.org;

    return 301 https://www.quenchquestsocialfoundation.org$request_uri;
}

# ---------------------------------------------------------------- website
server {
    listen 80;
    listen [::]:80;
    server_name www.quenchquestsocialfoundation.org;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://qq_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://qq_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Visitors always reach Cloudflare over https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------- API
server {
    listen 80;
    listen [::]:80;
    server_name api.quenchquestsocialfoundation.org;

    client_max_body_size 20m;

    location /static/ {
        alias /var/lib/quenchquest-api/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /var/lib/quenchquest-api/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location / {
        proxy_pass http://qq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Visitors always reach Cloudflare over https, so links Django builds use https://
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------- API, this machine only
server {
    listen 127.0.0.1:8081;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        alias /var/lib/quenchquest-api/static/;
    }

    location /media/ {
        alias /var/lib/quenchquest-api/media/;
    }

    location / {
        proxy_pass http://qq_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
