# QuenchQuest on the server's IP address, before the domain is connected.
#
#   Website  http://<SERVER-IP>:8080   → Next.js on 127.0.0.1:3100
#   API      http://<SERVER-IP>:8081   → gunicorn socket, plus /static/ and /media/
#
# Own ports and own upstream names, so this file can't change how any other site
# on this server (e.g. Kavya) is routed. Install:
#   sudo cp deploy/nginx-quenchquest-ip.conf /etc/nginx/sites-available/quenchquest-ip
#   sudo ln -s /etc/nginx/sites-available/quenchquest-ip /etc/nginx/sites-enabled/quenchquest-ip
#   sudo nginx -t && sudo systemctl reload nginx      # reload = graceful, never restart
#
# When the domain is ready, replace this file with nginx-quenchquest-domain.conf.

upstream qq2_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream qq2_api {
    server unix:/run/quenchquest-api/gunicorn.sock;
}

# ---------------------------------------------------------------- website
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://qq2_web;
        proxy_set_header Host $http_host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://qq2_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------- API
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    # Certificate templates (15 MB) and photos (5 MB)
    client_max_body_size 20m;

    location /static/ {
        alias /var/lib/quenchquest-api/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /var/lib/quenchquest-api/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location / {
        proxy_pass http://qq2_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
