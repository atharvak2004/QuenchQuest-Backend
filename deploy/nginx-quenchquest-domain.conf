# QuenchQuest on its domains.
#
#   https://www.quenchquestsocialfoundation.org   website (bare domain redirects here)
#   https://api.quenchquestsocialfoundation.org   API, /static/, /media/
#   http://127.0.0.1:8081                         API for the website's own server-side
#                                                 requests and health checks (this
#                                                 machine only, never public)
#
# Can be enabled ALONGSIDE nginx-quenchquest-ip.conf (different upstream names), so
# the switch from IP to domain has no downtime. Install (see DEPLOYMENT.md step 12):
#   sudo cp deploy/nginx-quenchquest-domain.conf /etc/nginx/sites-available/quenchquest
#   sudo ln -s /etc/nginx/sites-available/quenchquest /etc/nginx/sites-enabled/quenchquest
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect --cert-name quenchquest -d quenchquestsocialfoundation.org \
#        -d www.quenchquestsocialfoundation.org -d api.quenchquestsocialfoundation.org
# Certbot adds the HTTPS (443) parts to this file. These server blocks only answer
# for these names, so other sites on the server (e.g. Kavya) keep their own traffic.

upstream qq_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream qq_api {
    server unix:/run/quenchquest-api/gunicorn.sock;
}

# ---------------------------------------------------------------- bare domain → www
server {
    listen 80;
    listen [::]:80;
    server_name quenchquestsocialfoundation.org;
    return 301 https://www.quenchquestsocialfoundation.org$request_uri;
}

# ---------------------------------------------------------------- website
server {
    listen 80;
    listen [::]:80;
    server_name www.quenchquestsocialfoundation.org;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://qq_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://qq_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------- API
server {
    listen 80;
    listen [::]:80;
    server_name api.quenchquestsocialfoundation.org;

    client_max_body_size 20m;

    location /static/ {
        alias /var/lib/quenchquest-api/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /var/lib/quenchquest-api/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location / {
        proxy_pass http://qq_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------- API, this machine only
# The website server fetches content here (API_URL=http://127.0.0.1:8081), and the
# deploy scripts health-check it. Bound to 127.0.0.1, so it is not reachable from outside.
server {
    listen 127.0.0.1:8081;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        alias /var/lib/quenchquest-api/static/;
    }

    location /media/ {
        alias /var/lib/quenchquest-api/media/;
    }

    location / {
        proxy_pass http://qq_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
