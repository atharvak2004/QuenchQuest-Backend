# QuenchQuest on its domains (use this INSTEAD of nginx-quenchquest-ip.conf once DNS points here).
#
#   https://www.quenchquestsocialfoundation.org   website (bare domain redirects here)
#   https://api.quenchquestsocialfoundation.org   API, /static/, /media/
#
# Install (see DEPLOYMENT.md, "Connect the domain"):
#   sudo cp deploy/nginx-quenchquest-domain.conf /etc/nginx/sites-available/quenchquest
#   sudo ln -s /etc/nginx/sites-available/quenchquest /etc/nginx/sites-enabled/quenchquest
#   sudo rm /etc/nginx/sites-enabled/quenchquest-ip        # same upstream names: only one may be enabled
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d quenchquestsocialfoundation.org -d www.quenchquestsocialfoundation.org -d api.quenchquestsocialfoundation.org
# Certbot adds the HTTPS (443) parts to this file. server_name blocks only answer for
# these names, so other sites on the server (e.g. Kavya) keep their own traffic.

upstream qq2_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream qq2_api {
    server unix:/run/quenchquest-api/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name quenchquestsocialfoundation.org;
    return 301 https://www.quenchquestsocialfoundation.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.quenchquestsocialfoundation.org;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    location /_next/static/ {
        proxy_pass http://qq2_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://qq2_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.quenchquestsocialfoundation.org;

    client_max_body_size 20m;

    location /static/ {
        alias /var/lib/quenchquest-api/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /var/lib/quenchquest-api/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location / {
        proxy_pass http://qq2_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
